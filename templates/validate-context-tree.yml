name: Validate Context Tree

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Context Tree
        run: npx --yes @first-tree-ai/context-tree@{{packageVersion}} verify --tree-path .
